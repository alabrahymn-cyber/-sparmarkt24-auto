<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SparMarkt24 – KoRo Angebote</title>
  <meta name="description" content="KoRo Produkte, Preise und Angebote – automatisch aus dem Awin Produktfeed aktualisiert.">
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f6f7f8}
    *{box-sizing:border-box}
    body{margin:0}
    header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e6e6e6;padding:14px}
    .wrap{max-width:1200px;margin:auto}
    h1{margin:0 0 6px;font-size:26px}
    .notice{font-size:13px;color:#5f6368;margin-bottom:12px}
    .controls{display:grid;grid-template-columns:1fr 220px;gap:10px}
    input,select{width:100%;padding:12px;border:1px solid #d7d7d7;border-radius:10px;background:#fff;font-size:16px}
    main{padding:18px 14px 40px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{background:#fff;border:1px solid #e7e7e7;border-radius:14px;padding:13px;box-shadow:0 2px 10px rgba(0,0,0,.04);display:flex;flex-direction:column}
    .card img{width:100%;height:210px;object-fit:contain;border-radius:10px;background:#fff}
    .card h2{font-size:17px;line-height:1.3;margin:10px 0 6px}
    .price{font-size:19px;font-weight:700;margin:0 0 8px}
    .desc{font-size:13px;line-height:1.45;color:#60646b;flex:1}
    .btn{display:block;text-align:center;text-decoration:none;background:#5b7f18;color:#fff;padding:11px 12px;border-radius:9px;margin-top:10px;font-weight:700}
    .count{font-size:13px;color:#666;margin:10px 0}
    #consent{position:fixed;left:12px;right:12px;bottom:12px;z-index:999;background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.22);max-width:720px;margin:auto}
    #consent p{margin:6px 0 12px;line-height:1.45}
    #consent button{padding:10px 16px;border-radius:9px;border:1px solid #888;margin-right:7px;font-weight:700}
    #consent .accept{background:#5b7f18;color:#fff;border-color:#5b7f18}
    .hidden{display:none!important}
    @media(max-width:650px){.controls{grid-template-columns:1fr}.card img{height:180px}}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>KoRo Angebote</h1>
    <div class="notice">Werbung – diese Seite enthält Affiliate-Links. Bei einem qualifizierten Kauf kann SparMarkt24 eine Provision erhalten.</div>
    <div class="controls">
      <input id="q" type="search" placeholder="Produkt suchen …">
      <select id="cat"><option value="">Alle Kategorien</option></select>
    </div>
    <div class="count" id="count"></div>
  </div>
</header>

<main class="wrap"><div class="grid" id="grid"></div></main>

<div id="consent" class="hidden">
  <strong>Affiliate-Cookies</strong>
  <p>Wir verwenden Awin für Affiliate-Links. Du kannst Affiliate-Tracking akzeptieren oder ablehnen. Deine Auswahl wird im Browser gespeichert.</p>
  <button class="accept" id="accept">Akzeptieren</button>
  <button id="reject">Ablehnen</button>
</div>

<script>
let products = [];
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const cat = document.getElementById('cat');
const count = document.getElementById('count');
const consentBox = document.getElementById('consent');
const KEY='awinConsent';

function consentValue(){
  return localStorage.getItem(KEY)==='1' ? '1' : '0';
}
function trackingLink(url){
  try{
    const u=new URL(url);
    if(u.hostname.includes('awin1.com')) u.searchParams.set('cons', consentValue());
    return u.toString();
  }catch(e){return url}
}
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
  const term=q.value.trim().toLowerCase();
  const c=cat.value;
  const shown=products.filter(p=>{
    const hay=(p.name+' '+p.description+' '+p.category).toLowerCase();
    return (!term || hay.includes(term)) && (!c || p.category===c);
  });
  count.textContent = shown.length + ' Produkte';
  grid.innerHTML=shown.map(p=>`
    <article class="card">
      ${p.image?`<img loading="lazy" src="${esc(p.image)}" alt="${esc(p.name)}">`:''}
      <h2>${esc(p.name)}</h2>
      <div class="price">${esc(p.price)} ${esc(p.currency)}</div>
      <div class="desc">${esc((p.description||'').slice(0,220))}</div>
      <a class="btn" href="${esc(trackingLink(p.link))}" target="_blank" rel="nofollow sponsored noopener">Zum Produkt</a>
    </article>`).join('');
}
async function init(){
  const r=await fetch('products.json?ts='+Date.now());
  products=await r.json();
  const cats=[...new Set(products.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o);});
  render();
  if(localStorage.getItem(KEY)!=='1' && localStorage.getItem(KEY)!=='0') consentBox.classList.remove('hidden');
}
q.addEventListener('input',render); cat.addEventListener('change',render);
document.getElementById('accept').onclick=()=>{localStorage.setItem(KEY,'1');consentBox.classList.add('hidden');render();};
document.getElementById('reject').onclick=()=>{localStorage.setItem(KEY,'0');consentBox.classList.add('hidden');render();};
init();
</script>
</body>
</html>
